{% extends "base.html" %}{% block content %}<h1>New journal entry</h1><form method="post">{% csrf_token %}<label>Entry number</label><input name="entry_number" placeholder="Auto-generated if blank"><label>Date</label><input type="date" name="date"><label>Memo</label><input name="memo">{% for i in "1234" %}<hr><h3>Line {{i}}</h3><label>Account</label><select name="account_{{i}}"><option value="">-- optional --</option>{% for a in accounts %}<option value="{{a.pk}}">{{a.code}} - {{a.name}}</option>{% endfor %}</select><label>Description</label><input name="description_{{i}}"><label>Debit</label><input name="debit_{{i}}" type="number" step="0.01" value="0"><label>Credit</label><input name="credit_{{i}}" type="number" step="0.01" value="0">{% endfor %}<button>Validate and post journal</button></form>{% endblock %}
